[project]
name = "claude-scene-generator"
version = "0.1.0"
description = "Declarative, agent-usable scene generation for Isaac Sim (scene spec -> USD)"
readme = "README.md"
authors = [
    { name = "Sebastian Nae", email = "naesebi2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "usd-core==24.11",
]

[project.scripts]
claude-scene-generator = "claude_scene_generator:main"
csg = "claude_scene_generator.cli:main"
csg-import-mesh = "claude_scene_generator.assets.mesh.import_mesh:main"
csg-mcp = "claude_scene_generator.mcp_server:main"

[project.optional-dependencies]
mesh = [
    "coacd>=1.0.14",
    "trimesh>=5.1.1",
]
mcp = [
    "mcp>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
